<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Christopher Neale — Portfolio</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--muted:#9aa4b2;--accent:#60a5fa;--glass: rgba(255,255,255,0.03)}
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial; margin:0; background:linear-gradient(180deg,#08101a 0%, #0f1724 100%); color:#e6eef6;}
    header{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid rgba(255,255,255,0.03);backdrop-filter: blur(6px)}
    .brand{display:flex;gap:14px;align-items:center}
    .logo{width:56px;height:56px;border-radius:10px;overflow:hidden;flex-shrink:0;border:1px solid rgba(255,255,255,0.04)}
    .logo img{width:100%;height:100%;object-fit:cover}
    nav a{color:var(--muted);text-decoration:none;margin-left:18px;font-weight:600}
    nav a.active{color:var(--accent)}
    main{max-width:1100px;margin:28px auto;padding:24px}
    .hero{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:start}
    .photo{width:120px;height:120px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.04)}
    .photo img{width:100%;height:100%;object-fit:cover}
    .intro h1{margin:0 0 6px 0;font-size:22px}
    .intro p{margin:0;color:var(--muted)}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:18px;border-radius:12px;margin-top:18px;border:1px solid rgba(255,255,255,0.03)}
    .two-col{display:grid;grid-template-columns:1fr 320px;gap:18px;margin-top:18px}
    .skills{display:flex;flex-wrap:wrap;gap:8px}
    .skill{background:var(--glass);padding:6px 10px;border-radius:8px;color:var(--muted);font-size:13px}
    .section-title{font-weight:700;margin-bottom:8px}
    .resume-item{margin-bottom:12px}
    footer{max-width:1100px;margin:40px auto;color:var(--muted);padding:0 24px}
    pre.note{background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;color:var(--muted);overflow:auto}
    @media (max-width:880px){.two-col{grid-template-columns:1fr}.hero{grid-template-columns:96px 1fr}}

    /* --- Chat (embedded, top of Home) --- */
    .chat-embed{padding:0;border-color:rgba(96,165,250,0.25)}
    .chat-embed-header{padding:20px 20px 6px}
    .chat-embed-header h2{margin:0 0 4px;font-size:19px}
    .chat-embed-header p{margin:0;color:var(--muted);font-size:14px}
    .chat-prompts{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px 4px}
    .chat-prompt-btn{background:var(--glass);border:1px solid rgba(255,255,255,0.08);color:var(--accent);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
    .chat-prompt-btn:hover{background:rgba(96,165,250,0.14)}
    #chat-messages{min-height:0;max-height:340px;overflow-y:auto;padding:6px 20px;display:flex;flex-direction:column;gap:10px}
    #chat-messages:empty{display:none;padding:0}
    .chat-msg{max-width:80%;padding:9px 13px;border-radius:10px;font-size:14px;line-height:1.5}
    .chat-msg.user{align-self:flex-end;background:var(--accent);color:#08101a}
    .chat-msg.assistant{align-self:flex-start;background:var(--glass);color:#e6eef6;border:1px solid rgba(255,255,255,0.04)}
    .chat-msg.pending{color:var(--muted);font-style:italic}
    #chat-form{display:flex;gap:8px;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.06);margin-top:14px}
    #chat-input{flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 12px;color:#e6eef6;font-size:14px;font-family:inherit;resize:none}
    #chat-input:focus{outline:1px solid var(--accent)}
    #chat-send{background:var(--accent);color:#08101a;border:none;border-radius:8px;padding:0 16px;font-weight:700;cursor:pointer}
    #chat-send:disabled{opacity:0.5;cursor:default}
  </style>
</head>

  <script>
    // --- Simple client-side router ---
    const routes = {
      '/': renderHome,
      '/resume': renderResume,
      '/projects': renderProjects,
      '/project/podflow': renderPodflowCase,
      '/project/resume-chat': renderChatCase,
      '/project/chefai': renderChefAICase,
      '/project/tensorfit': renderTensorfitCase,
      '/project/mushroom-classifier': renderMushroomCase,
    }

    function setActiveLink(path){
      document.querySelectorAll('nav a').forEach(a=>{
        a.classList.toggle('active', a.getAttribute('href') === '#'+path);
      })
    }

    function router(){
      const hash = location.hash || '#/'
      const path = hash.slice(1) // e.g. '/resume'
      setActiveLink(path)
      const view = routes[path] || (()=>{document.getElementById('app').innerHTML = `<div class="card"><h3>Page not found</h3></div>`})
      view()
    }

    // --- Views ---
    function renderHome(){
      document.getElementById('app').innerHTML = `
        <div class="card chat-embed" id="chat-embed">
          <div class="chat-embed-header">
            <h2>Ask about Chris</h2>
            <p>Get grounded answers about his background — real chunked retrieval behind this, not just a stuffed prompt. Try a question:</p>
          </div>
          <div class="chat-prompts" id="chat-prompts"></div>
          <div id="chat-messages"></div>
          <form id="chat-form">
            <textarea id="chat-input" rows="1" placeholder="Ask a question…" maxlength="1000"></textarea>
            <button id="chat-send" type="submit">Send</button>
          </form>
        </div>

        <section class="hero card">
          <div class="photo"><img src="headshot.jpg" alt="Chris Neale"></div>
          <div class="intro">
            <h1>Hi — I'm Christopher Neale</h1>
            <p>Data science leader with 4+ years building and shipping applied AI: LLM-powered chat and RAG systems, agentic workflows, and the marketing analytics infrastructure they sit on top of. I lead cross-functional AI initiatives end to end — from architecture through evaluation to production — and I write the code myself, including with tools like Claude Code.</p>
            <div style="margin-top:12px" class="skills">
              <div class="skill">LLM / RAG</div><div class="skill">Agentic Workflows (LangGraph)</div><div class="skill">Prompt Engineering</div><div class="skill">Python</div><div class="skill">SQL</div><div class="skill">Tableau</div><div class="skill">CRM & CDP</div>
            </div>
          </div>
        </section>

          <div>
            <div class="card">
              <div class="section-title">About</div>
              <p style="color:var(--muted)">I lead applied-AI work at the intersection of data science and production engineering: internal RAG chat tools, agentic compliance systems, and the BI infrastructure that grounds them in real data. I care most about the parts that are easy to skip — evaluation, graceful degradation, and making sure an AI system's tradeoffs (latency, cost, reliability) are a deliberate choice, not an accident. This site (copy, retrieval architecture, and eval harnesses included) is itself built end-to-end with Claude Code.</p>
            </div>

            <div class="card">
              <div class="section-title">Interests & Hobbies</div>
              <p style="color:var(--muted)">I love using data to over analyze my golf game and my fantasy football teams — enough that I built a full club-fitting analytics platform as a side project. See <a href="#/project/tensorfit" data-link style="color:var(--accent)">TensorFit</a> under Projects.</p>
            </div>
          </div>

          <aside>
            <div class="card">
              <div class="section-title">Quick Links</div>
              <div style="color:var(--muted);font-size:14px;line-height:1.6">
                <div><strong>Email:</strong> cjneale.analyst@gmail.com</div>
                <div><strong>Location:</strong> Raleigh, NC</div>
                <div><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/christophernealeanalyst/" target="_blank" style="color:var(--accent)">christophernealeanalyst</a></div>
              </div>
            </div>

            <div class="card" style="margin-top:12px">
              <div class="section-title">Skills & Tools</div>
              <div style="color:var(--muted);font-size:14px;line-height:1.6">
                LLM/RAG · LangGraph (Agentic) · Prompt Engineering · Tableau · Power BI · GA4 · Python · SQL · Databricks · Scikit-learn · AWS
              </div>
            </div>
          </aside>
        </div>
      `
      initChat()
    }

    function renderResume(){
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div style="display:flex;gap:18px;align-items:center">
            <div class="photo" style="width:96px;height:96px"><img src="headshot.jpg" alt="Chris"></div>
            <div>
              <div style="font-weight:800;font-size:18px">Christopher Neale</div>
              <div style="color:var(--muted);font-size:13px">Data Science &amp; Applied AI Leader</div>
              <div style="color:var(--muted)">Raleigh, NC · cjneale.analyst@gmail.com · 984-382-3980 · <a href="https://www.linkedin.com/in/christophernealeanalyst/" target="_blank" style="color:var(--accent)">LinkedIn</a></div>
            </div>
          </div>

          <hr style="margin:14px 0;border:none;border-top:1px solid rgba(255,255,255,0.03)">

            <div style="color:var(--muted)">Nov 2025 – Present</div>
            <ul style="color:var(--muted);margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.6">
              <li>Built an autonomous data enrichment pipeline connecting LLM APIs to the CRM database, generating personalized outreach content and powering a lead-scoring model that prioritizes high-value accounts.</li>
              <li>Led a CRM systems transformation (HubSpot governance, scalable data architecture, deduplication workflows, Master Data Management), then redesigned performance dashboards and attribution frameworks connecting marketing activity to acquisition, retention, and high-value segments.</li>

              <li>Developed AI proposal and agreement tools enabling the sales team to build company-approved assets quickly at scale.</li>
            </ul>
          </div>

          <div class="resume-item">
            <div style="font-weight:700">Sr. Data Analyst, CRM — TRANZACT (Raleigh, NC)</div>
            <div style="color:var(--muted)">May 2022 – Nov 2025</div>
            <ul style="color:var(--muted);margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.6">
              <li>Partnered with commercial and finance leadership on sales performance, attribution, and forecasting analytics, and built CRM/ESP integrations (SQL, JSON REST APIs) syncing behavioral data into Iterable for 10+ lifecycle campaigns.</li>

            <div style="color:var(--muted);font-size:14px;line-height:1.6">American Kennel Club, Email Marketing Associate (2021–2022); OnPoint, Marketing Manager (2020–2021): lifecycle marketing, Tableau-driven audience insights, and GTM execution with C-suite alignment.</div>

          </div>

          </div>

          <div class="section-title" style="margin-top:12px">Education</div>

    function projectCard(title, blurb, status, href){
      return `
        <div style="padding:14px;border-radius:10px;background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.02)">
          <div style="font-weight:700">${title}</div>
          <div style="color:var(--muted);font-size:14px;margin-top:4px">${blurb}</div>
          <div style="margin-top:8px;display:flex;align-items:center;gap:10px">
            <a href="${href}" data-link style="color:var(--accent)">Read the case study</a>
            <span style="color:var(--muted);font-size:12px">${status}</span>
          </div>
        </div>
      `
    }

    function renderProjects(){
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="section-title">Projects</div>
          <p style="color:var(--muted)">Applied AI builds with real architecture behind them, plus the ML modeling fundamentals underneath — not just prompt wrappers. Built end-to-end with Claude Code.</p>

          <div class="section-title" style="margin-top:18px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em">Applied AI &amp; Production Systems</div>
          <div style="display:grid;gap:12px;margin-top:10px">
            ${projectCard(

              'Unstructured podcast audio → structured, searchable chapters. Own trained segmentation model + LLM enrichment with a working degradation path.',

              '#/project/podflow'
            )}
            ${projectCard(
              'Resume Chat — Retrieval-Augmented Q&A',
              'The "Ask about Chris" widget on this site: chunked retrieval, cosine-ranked context, grounded generation, and an automated eval harness.',

              '#/project/resume-chat'
            )}
            ${projectCard(
              'ChefAI — Agentic Meal Planning',
              'A LangGraph state-machine agent that slot-fills constraints (allergies, diet, budget, prep time) before generating recipes.',
              'Live public demo',
              '#/project/chefai'
            )}
          </div>

          <div class="section-title" style="margin-top:22px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em">ML Modeling &amp; Data Products</div>
          <div style="display:grid;gap:12px;margin-top:10px">
            ${projectCard(
              'TensorFit — Golf Club-Fitting Platform',
              'Full-stack SaaS: normalizes shot data from 8 launch-monitor brands, real dispersion/consistency statistics, and a documented shadow-mode ML rollout plan.',

            ${projectCard(

              '#/project/mushroom-classifier'
            )}
            <div style="padding:14px;border-radius:10px;background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.02)">
              <div style="font-weight:700">Applied ML Coursework</div>
              <div style="color:var(--muted);font-size:14px;margin-top:4px">Four more hands-on projects from the M.S. program: face detection &amp; recognition (MTCNN + transfer learning on a frozen VGGFace network), a class-imbalance classifier (COVID-19 diagnosis, before/after class weighting), a PCA-vs-t-SNE cluster visualization comparison, and end-to-end model deployment via Flask (train → pickle → serve). Instructor-provided scaffolding on some of the plumbing/plotting code — the modeling and interpretation is mine.</div>
            </div>
          </div>
        </div>

    function caseStudy({title, subtitle, problem, architecture, tradeoffs, stack, status, link}){
      const archItems = architecture.map(i => `<li>${i}</li>`).join('')
      const tradeoffItems = tradeoffs.map(i => `<li>${i}</li>`).join('')
      return `
        <div class="card">
          <div style="font-weight:800;font-size:20px">${title}</div>
          <div style="color:var(--muted);margin-top:4px">${subtitle}</div>

          <div class="section-title" style="margin-top:18px">Problem</div>
          <p style="color:var(--muted)">${problem}</p>

          <div class="section-title" style="margin-top:14px">Architecture</div>
          <ul style="color:var(--muted);margin:0;padding-left:18px;line-height:1.7">${archItems}</ul>

          <div class="section-title" style="margin-top:14px">Tradeoffs</div>
          <ul style="color:var(--muted);margin:0;padding-left:18px;line-height:1.7">${tradeoffItems}</ul>

          <div class="section-title" style="margin-top:14px">Stack</div>
          <div class="skills" style="margin-bottom:4px">${stack.map(s => `<div class="skill">${s}</div>`).join('')}</div>

          <div class="section-title" style="margin-top:14px">Status</div>
          <p style="color:var(--muted)">${status}${link ? ` — ${link}` : ''}</p>

          <div style="margin-top:10px"><a href="#/projects" data-link style="color:var(--accent)">&larr; Back to Projects</a></div>
        </div>
      `
    }

    function renderPodflowCase(){
      document.getElementById('app').innerHTML = caseStudy({
        title: 'PodFlow',
        subtitle: 'Turning unstructured audio into structured content intelligence',
        problem: 'Podcast episodes are long, unstructured audio with no chapter markers. Finding the 90 seconds a listener actually wants means scrubbing the whole file. The same shape of problem — long unstructured content that needs to become structured, navigable, retrievable intelligence — shows up constantly in legal and business content, not just podcasts.',
        architecture: [
          'RSS ingestion pulls episode metadata and audio URLs, deduped and upserted into Postgres (genre/topic/artwork tracked for filtering).',
          'faster-whisper transcribes full episode audio locally.',
          'A CNN-BiLSTM boundary-segmentation model I trained myself (not an LLM call) predicts chapter boundaries from audio features — the same feature-extraction pipeline is shared verbatim between training and inference to guarantee train/serve parity.',
          'A local LLM (Qwen, via llama.cpp) enriches each chapter with a title/description/tags, reading only the transcript text inside that chapter\'s boundaries.',
          'A Flask API serves random/filtered chapters to a lightweight player frontend.',
        ],
        tradeoffs: [
          'The LLM enrichment step has a documented, working heuristic fallback (first-sentence title + keyword tags) for when the local GGUF fails to load on hardware without AVX-512 — the pipeline degrades gracefully instead of failing the whole batch. This was a deliberate reliability choice, not an afterthought.',
          'Chapter segmentation uses a purpose-trained small model instead of asking an LLM to find boundaries — cheaper, faster, and more consistent at batch scale than an LLM call per episode.',
          'Segmentation quality is measured with an offline eval (precision/recall/F1 against 16 human-labeled episodes, boundary-tolerance window) rather than eyeballing outputs. Running it surfaced a real finding, not a clean pass: the model over-segments long-form sports/talk content at its default threshold (aggregate F1 0.11), a different profile than the shorter daily-news episodes it\'s mostly been run against since. Concrete next step: per-content-type threshold tuning — exactly the kind of gap an eval harness is supposed to surface before it becomes a silent quality regression.',
        ],
        stack: ['Python', 'Flask', 'PostgreSQL', 'PyTorch', 'faster-whisper', 'llama.cpp', 'Feature Engineering'],
        status: 'Restored and running locally end-to-end (ingestion → transcription → segmentation → enrichment → serving).',
        link: '<a href="player.html" style="color:var(--accent)">open the player</a>',
      })
    }

    function renderChatCase(){
      document.getElementById('app').innerHTML = caseStudy({
        title: 'Resume Chat',
        subtitle: 'The "Ask about Chris" widget on this site — real retrieval, not a stuffed prompt',
        problem: 'A visitor should be able to ask a natural-language question about my background and get an accurate, grounded answer — and just as importantly, a clear "I don\'t know, email Chris" when the question is out of scope, instead of a confident hallucination.',
        architecture: [
          'My background doc is chunked by section (personal, education, per-employer experience, skills).',
          'Each chunk gets a TF-IDF vector at server startup; each incoming question gets the same treatment at request time.',
          'Cosine similarity ranks chunks against the question; only the top-matching chunks (plus an always-included identity chunk) go into the system prompt — real retrieval, not "paste the whole resume every time."',
          'The grounded prompt goes to an LLM via OpenRouter, server-side only — the API key never reaches the browser.',
          'An automated eval harness (test set of factual + out-of-scope questions) scores grounding accuracy and refusal behavior on every change, instead of me eyeballing a few chats and calling it done.',
        ],
        tradeoffs: [
          'TF-IDF sparse retrieval instead of dense embeddings: zero extra API dependency or cost for a corpus this size, and it\'s a legitimate retrieval technique on its own — but it won\'t catch semantic matches that share no vocabulary with the question. At production scale with a larger, more varied corpus, I\'d move to dense embeddings against a real vector store (pgvector/Pinecone) for semantic recall; the chunking and ranking interface here is already shaped to make that swap contained.',
          'Non-streaming responses for simplicity — streaming would feel snappier and is the obvious next iteration.',
          'Retrieval narrows the prompt to only relevant chunks, which is also a real latency/cost win, not just an architecture nicety.',

    // --- Resume chat (embedded at the top of Home) ---
    const chatHistory = [] // {role: 'user'|'assistant', content: string} — persists across route changes

    const CANNED_PROMPTS = [
      "What does Chris do at flyExclusive?",
      "What LLM and RAG projects has Chris built?",
      "What's Chris's educational background?",
      "How can I get in touch with Chris?",
    ]

    function appendMessage(container, role, text, opts){
      opts = opts || {}
      const div = document.createElement('div')
      div.className = 'chat-msg ' + role + (opts.pending ? ' pending' : '')
      div.textContent = text
      container.appendChild(div)
      container.scrollTop = container.scrollHeight
      return div
    }

    async function sendChatMessage(els, rawText){
      const text = rawText.trim()
      if(!text) return

      els.input.value = ''
      els.input.disabled = true
      els.send.disabled = true
      els.prompts.style.display = 'none'

      appendMessage(els.messages, 'user', text)
      chatHistory.push({role: 'user', content: text})
      const pending = appendMessage(els.messages, 'assistant', 'Thinking…', {pending: true})

      try{
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({messages: chatHistory})
        })
        const data = await res.json().catch(()=>({}))
        if(!res.ok || !data.reply){
          throw new Error(data.error || 'Something went wrong')
        }
        pending.textContent = data.reply
        pending.classList.remove('pending')
        chatHistory.push({role: 'assistant', content: data.reply})
      }catch(err){
        pending.textContent = "Sorry, I couldn't get a response right now. Try again in a moment, or email cjneale.analyst@gmail.com."
        pending.classList.remove('pending')
      }finally{
        els.input.disabled = false
        els.send.disabled = false
        els.input.focus()
      }
    }

    // Home's DOM is rebuilt every time you navigate back to it, so the chat
    // UI has to be re-wired (and any prior conversation replayed) each time
    // renderHome() runs — chatHistory itself lives outside render and survives.
    function initChat(){
      const els = {
        messages: document.getElementById('chat-messages'),
        form: document.getElementById('chat-form'),
        input: document.getElementById('chat-input'),
        send: document.getElementById('chat-send'),
        prompts: document.getElementById('chat-prompts'),
      }
      if(!els.form) return

      els.prompts.innerHTML = CANNED_PROMPTS
        .map(p => `<button type="button" class="chat-prompt-btn" data-prompt="${p.replace(/"/g, '&quot;')}">${p}</button>`)
        .join('')

      chatHistory.forEach(m => appendMessage(els.messages, m.role, m.content))
      if(chatHistory.length) els.prompts.style.display = 'none'

      els.form.addEventListener('submit', function(e){
        e.preventDefault()
        sendChatMessage(els, els.input.value)
      })

      els.input.addEventListener('keydown', function(e){
        if(e.key === 'Enter' && !e.shiftKey){
          e.preventDefault()
          els.form.requestSubmit()
        }
      })

      els.prompts.addEventListener('click', function(e){
        const btn = e.target.closest('.chat-prompt-btn')
        if(!btn) return
        sendChatMessage(els, btn.dataset.prompt)
      })
    }

    // initialize
    window.addEventListener('hashchange', router)
    window.addEventListener('load', router)
  </script>

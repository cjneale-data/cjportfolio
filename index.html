<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Christopher Neale — Data Science &amp; Applied AI</title>
  <meta name="description" content="Christopher Neale — Data Science &amp; Applied AI Leader. LLM/RAG systems, agentic workflows, and the marketing analytics infrastructure they run on." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#F5F6F2; --card:#FFFFFF; --ink:#17201B; --muted:#57635A;
      --accent:#2C5C4C; --on-accent:#FFFFFF; --brass:#A67C3D; --line:#DCE0D8;
      --glass:rgba(44,92,76,0.05);
      --s1:#14805A; --s2:#C0781A; --s3:#3E6FC6; --s4:#8A5BBF; --s5:#B5475F; --loss:#B23A3A;
      --font-display:'Newsreader',Georgia,serif;
      --font-body:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
      --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#12160F; --card:#181D15; --ink:#E9ECE4; --muted:#9AA592;
        --accent:#6FB39A; --on-accent:#0C1310; --brass:#D3A968; --line:#2A322A;
        --glass:rgba(111,179,154,0.08);
        --s1:#3FA37E; --s2:#C27E22; --s3:#5E8EE0; --s4:#9C7AD6; --s5:#D0607A; --loss:#E07A7A;
      }
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
    @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{animation-duration:.01ms !important;transition-duration:.01ms !important} }

    a{color:var(--accent);text-decoration-color:var(--line);text-underline-offset:3px}
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    h1,h2,h3{font-family:var(--font-display);font-weight:500;color:var(--ink);text-wrap:balance;margin:0}
    h1{font-size:clamp(28px,4vw,38px);font-style:italic;letter-spacing:-0.01em;line-height:1.15}
    h2{font-size:22px}
    h3{font-size:17px}

    header{max-width:860px;margin:0 auto;padding:36px 24px 0}
    .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}
    .brand{display:flex;gap:14px;align-items:center}
    .logo{width:50px;height:50px;border-radius:4px;overflow:hidden;flex-shrink:0;border:1px solid var(--line)}
    .logo img{width:100%;height:100%;object-fit:cover;display:block}
    .brand-name{font-family:var(--font-display);font-style:italic;font-size:19px;color:var(--ink);line-height:1.2}
    .brand-role{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
    nav{display:flex;gap:2px;flex-wrap:wrap}
    nav a{font-family:var(--font-mono);font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:7px 10px;position:relative;transition:color .15s}
    nav a:hover{color:var(--ink)}
    nav a.active{color:var(--accent)}
    nav a.active::after{content:'';position:absolute;left:10px;right:10px;bottom:2px;height:2px;background:var(--accent)}

    main{max-width:860px;margin:0 auto;padding:8px 24px 64px;animation:fade-in .25s ease both}
    @keyframes fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

    .hero{display:grid;grid-template-columns:100px 1fr;gap:22px;align-items:start}
    .photo{width:100px;height:100px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
    .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .intro h1{margin:0 0 8px}
    .intro p{margin:0;color:var(--muted);max-width:62ch}

    .card{background:var(--card);padding:22px 24px;border-radius:4px;margin-top:20px;border:1px solid var(--line)}
    .card>p{max-width:68ch}
    .two-col{display:grid;grid-template-columns:1fr 300px;gap:20px;margin-top:20px}
    .skills{display:flex;flex-wrap:wrap;gap:6px}
    .skill{font-family:var(--font-mono);font-size:11px;padding:4px 9px;border-radius:3px;color:var(--muted);background:var(--glass);border:1px solid var(--line)}
    .section-title{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
    .resume-item{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
    .resume-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}

    .entry{border-left:2px solid var(--line);padding:2px 0 2px 16px}
    .entry+.entry{margin-top:18px}
    .entry-title{font-weight:600;color:var(--ink)}
    .entry-blurb{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.55;max-width:60ch}
    .entry-meta{margin-top:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .entry-status{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px}
    .entry-status .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);flex-shrink:0}
    .entry a{font-size:13px;font-weight:500}

    footer{max-width:860px;margin:44px auto 60px;padding:20px 24px 0;color:var(--muted);border-top:1px solid var(--line);font-size:12px;font-family:var(--font-mono);letter-spacing:.02em}

    @media (max-width:720px){.two-col{grid-template-columns:1fr}.hero{grid-template-columns:84px 1fr}.masthead{align-items:flex-start}}

    /* --- Chat (embedded, top of Home) --- */
    .chat-embed{padding:0;overflow:hidden}
    .chat-embed-header{padding:22px 24px 4px}
    .chat-embed-header h2{margin:0 0 4px;font-size:19px}
    .chat-embed-header p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
    .chat-prompts{display:flex;flex-wrap:wrap;gap:8px;padding:16px 24px 4px}
    .chat-prompt-btn{font-family:var(--font-mono);background:var(--bg);border:1px solid var(--line);color:var(--accent);border-radius:3px;padding:7px 12px;font-size:12px;cursor:pointer;transition:background .15s,border-color .15s}
    .chat-prompt-btn:hover{background:var(--glass);border-color:var(--accent)}
    #chat-messages{min-height:0;max-height:340px;overflow-y:auto;padding:8px 24px;display:flex;flex-direction:column;gap:10px}
    #chat-messages:empty{display:none;padding:0}
    .chat-msg{max-width:80%;padding:10px 14px;border-radius:4px;font-size:14px;line-height:1.55}
    .chat-msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
    .chat-msg.assistant{align-self:flex-start;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
    .chat-msg.pending{color:var(--muted);font-style:italic}
    #chat-form{display:flex;gap:10px;padding:18px 24px;border-top:1px solid var(--line);margin-top:14px}
    #chat-input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;color:var(--ink);font-size:14px;font-family:var(--font-body);resize:none}
    #chat-input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
    #chat-send{background:var(--accent);color:var(--on-accent);border:none;border-radius:4px;padding:0 18px;font-weight:600;font-family:var(--font-body);cursor:pointer;transition:opacity .15s}
    #chat-send:hover{opacity:.85}
    #chat-send:disabled{opacity:.5;cursor:default}

    /* --- Case-study figures (Attribution Lab) --- */
    .viz-note{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--glass);border:1px dashed var(--line);border-radius:3px;padding:8px 10px;margin:4px 0 6px}
    .viz-fig{margin:22px 0 0}
    .viz-fig h3{font-family:var(--font-body);font-size:14px;font-weight:600;margin:0}
    .viz-fig .viz-sub{color:var(--muted);font-size:13px;margin:2px 0 12px;max-width:64ch}
    .viz-fig .viz-take{color:var(--muted);font-size:13px;margin:10px 0 0;max-width:64ch}
    .viz-flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;counter-reset:step}
    .viz-flow li{position:relative;border:1px solid var(--line);border-radius:4px;padding:10px;background:var(--bg);font-size:12px;color:var(--muted);line-height:1.45;counter-increment:step}
    .viz-flow li b{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
    .viz-flow li b::before{content:counter(step) ". "}
    .viz-flow li:not(:last-child)::after{content:'→';position:absolute;right:-8px;top:50%;transform:translate(50%,-50%);color:var(--muted);font-size:12px}
    .viz-rows{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;align-items:center;font-size:13px}
    .viz-rows .lbl{color:var(--ink)}
    .viz-rows .lbl small{display:block;color:var(--muted);font-size:11px;line-height:1.3}
    .viz-cell{display:flex;align-items:center;gap:8px;min-height:24px;cursor:default}
    .viz-bar{height:10px;border-radius:0 4px 4px 0;background:var(--muted);opacity:.55;flex:none}
    .viz-bar.hi{background:var(--accent);opacity:1}
    .viz-val{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
    .viz-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-bottom:10px}
    .viz-legend span{display:inline-flex;align-items:center;gap:6px}
    .viz-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
    .viz-journey{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .viz-journey li{border-top:3px solid var(--line);padding-top:8px;font-size:12px;color:var(--muted);line-height:1.45}
    .viz-journey li b{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink);font-weight:500}
    .viz-journey li.conv{border-top-color:var(--ink)}
    .viz-rows>*,.viz-models>*{min-width:0}
    .viz-stack{display:flex;gap:2px;height:22px;flex:1;min-width:0}
    .viz-stack span{height:100%;min-width:0;display:block;line-height:22px;padding:0 6px;font-family:var(--font-mono);font-size:10px;color:var(--on-accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .viz-stack span:first-child{border-radius:4px 0 0 4px}
    .viz-stack span:last-child{border-radius:0 4px 4px 0}
    .viz-models{display:grid;grid-template-columns:130px repeat(3,1fr);gap:4px 12px;align-items:center;font-size:13px}
    .viz-models .hd{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--line)}
    .viz-models .ch{font-family:var(--font-mono);font-size:12px;color:var(--ink)}
    .viz-table{width:100%;border-collapse:collapse;font-size:13px}
    .viz-table th,.viz-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
    .viz-table th{font-family:var(--font-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
    .viz-table td.n{font-family:var(--font-mono);text-align:right}
    .viz-table th.n{text-align:right}
    .viz-details{margin-top:10px;font-size:13px}
    .viz-details summary{cursor:pointer;color:var(--accent);font-size:12px;font-family:var(--font-mono)}
    .viz-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .viz-tile{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--bg)}
    .viz-tile .k{font-size:12px;color:var(--muted);line-height:1.35}
    .viz-tile .v{font-family:var(--font-display);font-size:26px;color:var(--ink);line-height:1.2;margin-top:4px}
    .viz-tile .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
    .viz-journey.six{grid-template-columns:repeat(6,1fr)}
    .viz-pair .viz-cell{min-height:18px}
    .viz-pair .lbl{padding-top:2px}
    .viz-tabs{display:flex;flex-wrap:wrap;gap:6px}
    .viz-tab{font-family:var(--font-mono);font-size:12px;background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer}
    .viz-tab:hover{border-color:var(--accent);color:var(--ink)}
    .viz-tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
    .viz-swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:0}
    .viz-table td.loss{color:var(--loss);font-weight:600}
    .viz-table td.loss::after{content:' ▲';font-size:9px}
    .viz-table td.chg.up{color:var(--accent)}
    .viz-table td.chg.down{color:var(--muted)}
    .viz-table-wrap{overflow-x:auto}
    .viz-tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;padding:6px 9px;border-radius:4px;max-width:240px;opacity:0;transition:opacity .1s}
    @media (max-width:640px){
      .viz-flow{grid-template-columns:1fr}
      .viz-flow li:not(:last-child)::after{content:'↓';right:50%;top:auto;bottom:-8px;transform:translate(50%,50%)}
      .viz-rows{grid-template-columns:1fr;gap:2px}
      .viz-rows .lbl{margin-top:8px}
      .viz-journey,.viz-journey.six{grid-template-columns:repeat(2,1fr)}
      .viz-models{grid-template-columns:repeat(3,1fr)}
      .viz-models .ch{grid-column:1/-1;margin-top:8px}
      .viz-models .corner{display:none}
      .viz-tiles{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
  <header>
    <div class="masthead">
      <div class="brand">
        <div class="logo"><img src="headshot.jpg" alt="Christopher Neale photo"></div>
        <div>
          <div class="brand-name">Christopher Neale</div>
          <div class="brand-role">Data Science &amp; Applied AI Leader</div>
        </div>
      </div>
      <nav>
        <a href="#/" data-link>Home</a>
        <a href="#/resume" data-link>Resume</a>
        <a href="#/projects" data-link>Projects</a>
        <a href="journeys.html">Live Journeys</a>
        <a href="https://chefai-noemgucqmarbfwe2euwdsl.streamlit.app/" target="_blank" rel="noopener">ChefAI</a>
      </nav>
    </div>
  </header>

  <main id="app">
    <!-- Views are injected here by simple client-side router -->
  </main>

  <footer>
    <div>© Christopher Neale — Raleigh, NC · cjneale.analyst@gmail.com</div>
  </footer>

  <script>
    // --- Simple client-side router ---
    const routes = {
      '/': renderHome,
      '/resume': renderResume,
      '/projects': renderProjects,
      '/project/podflow': renderPodflowCase,
      '/project/resume-chat': renderChatCase,
      '/project/chefai': renderChefAICase,
      '/project/attribution': renderAttributionCase,
      '/project/utm-journeys': renderUtmCase,
      '/project/tensorfit': renderTensorfitCase,
      '/project/mushroom-classifier': renderMushroomCase,
    }

    function setActiveLink(path){
      document.querySelectorAll('nav a').forEach(a=>{
        a.classList.toggle('active', a.getAttribute('href') === '#'+path);
      })
    }

    function router(){
      const hash = location.hash || '#/'
      const path = hash.slice(1) // e.g. '/resume'
      setActiveLink(path)
      const view = routes[path] || (()=>{document.getElementById('app').innerHTML = `<div class="card"><h3>Page not found</h3></div>`})
      view()
    }

    // --- Views ---
    function renderHome(){
      document.getElementById('app').innerHTML = `
        <div class="card chat-embed" id="chat-embed">
          <div class="chat-embed-header">
            <div class="section-title" style="margin:0 0 8px;padding:0;border:none">Live demo</div>
            <h2>Ask about Christopher</h2>
            <p>Ask about my work. Answers come only from my resume and notes. <a href="#/project/resume-chat" data-link>How it works</a></p>
          </div>
          <div class="chat-prompts" id="chat-prompts"></div>
          <div id="chat-messages"></div>
          <form id="chat-form">
            <textarea id="chat-input" rows="1" placeholder="Ask a question…" maxlength="1000"></textarea>
            <button id="chat-send" type="submit">Send</button>
          </form>
        </div>

        <section class="hero card">
          <div class="photo"><img src="headshot.jpg" alt="Christopher Neale"></div>
          <div class="intro">
            <h1>Hi, I'm Christopher Neale</h1>
            <p>I lead data science and applied AI work. I build AI tools like chatbots and agents, and the marketing data systems they run on: tracking, attribution, and CRM data. I plan the work, write the code, and test it before it ships.</p>
            <div style="margin-top:12px" class="skills">
              <div class="skill">LLM / RAG</div><div class="skill">Agentic Workflows (LangGraph)</div><div class="skill">Prompt Engineering</div><div class="skill">Python</div><div class="skill">SQL</div><div class="skill">Tableau</div><div class="skill">CRM & CDP</div>
            </div>
          </div>
        </section>

        <div class="two-col">
          <div>
            <div class="card">
              <div class="section-title">About</div>
              <p style="color:var(--muted)">Most of my work connects marketing data to decisions: which ads are working, which leads to call first, what to charge. Lately that means AI tools: chat that answers from company data, agents that check documents, and pipelines that enrich the CRM. I care most about testing. Before anything ships, I want to know how well it works and what it does when something breaks. I built this site with Claude Code.</p>
            </div>

            <div class="card">
              <div class="section-title">Interests & Hobbies</div>
              <p style="color:var(--muted)">I use data to over-analyze my golf game and my fantasy football teams. The golf habit turned into a side project: <a href="#/project/tensorfit" data-link style="color:var(--accent)">TensorFit</a>.</p>
            </div>
          </div>

          <aside>
            <div class="card">
              <div class="section-title">Quick Links</div>
              <div style="color:var(--muted);font-size:14px;line-height:1.6">
                <div><strong>Email:</strong> cjneale.analyst@gmail.com</div>
                <div><strong>Location:</strong> Raleigh, NC</div>
                <div><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/christophernealeanalyst/" target="_blank" style="color:var(--accent)">christophernealeanalyst</a></div>
              </div>
            </div>

            <div class="card" style="margin-top:12px">
              <div class="section-title">Skills & Tools</div>
              <div style="color:var(--muted);font-size:14px;line-height:1.6">
                LLM/RAG · LangGraph (Agentic) · Prompt Engineering · Tableau · Power BI · GA4 · Python · SQL · Databricks · Scikit-learn · AWS
              </div>
            </div>
          </aside>
        </div>
      `
      initChat()
    }

    function renderResume(){
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div style="display:flex;gap:18px;align-items:center">
            <div class="photo" style="width:96px;height:96px"><img src="headshot.jpg" alt="Christopher"></div>
            <div>
              <div style="font-weight:800;font-size:18px">Christopher Neale</div>
              <div style="color:var(--muted);font-size:13px">Data Science &amp; Applied AI Leader</div>
              <div style="color:var(--muted)">Raleigh, NC · cjneale.analyst@gmail.com · 984-382-3980 · <a href="https://www.linkedin.com/in/christophernealeanalyst/" target="_blank" style="color:var(--accent)">LinkedIn</a></div>
            </div>
          </div>

          <hr style="margin:18px 0;border:none;border-top:1px solid var(--line)">

          <div class="section-title">Summary</div>
          <p style="color:var(--muted)">Data science practitioner with 5 years building production data and AI systems, most recently as Senior Manager at flyExclusive. M.S. in Data Science. Builds agentic and LLM-powered systems end to end, from LangGraph state machines to production pipelines, and moves fast from prototype to decisions executives can act on. Experienced vibe coder with a minimum of 4 terminals open at all times.</p>

          <div class="section-title" style="margin-top:12px">Technical Expertise</div>
          <div style="color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:12px">
            <div><strong>Applied AI / ML:</strong> PyTorch, scikit-learn, XGBoost, local LLM deployment, speech recognition, prompt design, offline model evaluation (precision/recall/F1)</div>
            <div><strong>Data &amp; Systems:</strong> Python, SQL, Databricks, REST APIs (Flask), CRM/CDP architecture, Master Data Management, data pipelines</div>
            <div><strong>Analytics &amp; Delivery:</strong> Tableau, Power BI, GA4, multi-touch attribution, A/B testing; AI-assisted development (Claude Code); executive stakeholder communication</div>
          </div>

          <div class="section-title">Professional Experience</div>
          <div class="resume-item">
            <div style="font-weight:700">Senior Manager, Marketing Insights &amp; CRM Analytics — flyExclusive (Raleigh, NC)</div>

    // Worked example for the attribution case study. A hypothetical subscription
    // brand: $100k/month across five paid channels, 1,000 new subscribers a month,
    // each worth $250 in lifetime value. Made-up numbers, real method.
    const ATTR = {
      value: 250,
      total: 1000,
      channels: [
        { key: 'brand',     label: 'Search, brand terms', color: 'var(--s2)', spend: 10000 },
        { key: 'nonbrand',  label: 'Search, non-brand',   color: 'var(--s3)', spend: 25000 },
        { key: 'meta',      label: 'Meta ads',            color: 'var(--s1)', spend: 35000 },
        { key: 'tiktok',    label: 'TikTok ads',          color: 'var(--s5)', spend: 15000 },
        { key: 'retarget',  label: 'Retargeting display', color: 'var(--s4)', spend: 15000 },
      ],
      // Subscribers credited to each paid channel, in channel order. Email and
      // organic take the rest of the 1,000; they have no media budget to move.
      models: [
        { key: 'last',     label: 'Last-touch',     plan: 'last-touch plan', credit: [300, 170, 120, 40, 150] },
        { key: 'first',    label: 'First-touch',    plan: 'first-touch plan', credit: [60, 200, 300, 150, 30] },
        { key: 'linear',   label: 'Linear',         plan: 'linear plan', credit: [170, 180, 200, 90, 110] },
        { key: 'position', label: 'Position-based', plan: 'position-based plan', credit: [180, 185, 215, 95, 95] },
        { key: 'lift',     label: 'Calibrated by lift tests', plan: 'lift-test-calibrated plan', credit: [45, 150, 230, 85, 25] },
      ],
      tests: ['Geo holdout on brand terms', 'Geo split test', 'Meta conversion lift study', 'TikTok conversion lift study', 'Ghost-ad holdout'],
      platforms: [
        { name: 'Google Ads', note: 'brand + non-brand search', n: 610 },
        { name: 'Meta Ads Manager', note: '7-day click, 1-day view', n: 520 },
        { name: 'Retargeting platform', note: 'counts view-throughs', n: 260 },
        { name: 'TikTok Ads Manager', note: '7-day click, 1-day view', n: 210 },
      ],
    }

    // Budget model: each channel has diminishing returns, subs = k * spend^0.6.
    // The optimizer equalizes marginal cost per subscriber across channels
    // (bisection on the shadow price), with no channel moving more than ±40%
    // in one month, holding total spend fixed.
    const CURVE = 0.6, GUARDRAIL = 0.4
    function allocate(credit){
      const spend = ATTR.channels.map(c => c.spend)
      const total = spend.reduce((a, b) => a + b)
      const k = credit.map((v, i) => v / Math.pow(spend[i], CURVE))
      const at = lambda => k.map((ki, i) => Math.min(spend[i] * (1 + GUARDRAIL),
        Math.max(spend[i] * (1 - GUARDRAIL), Math.pow(CURVE * ki / lambda, 1 / (1 - CURVE)))))
      let lo = 1e-6, hi = 100
      for (let i = 0; i < 100; i++) {
        const mid = Math.sqrt(lo * hi)
        if (at(mid).reduce((a, b) => a + b) > total) lo = mid
        else hi = mid
      }
      return at(Math.sqrt(lo * hi)).map(s => Math.round(s / 500) * 500)
    }
    // Judge every plan by what the lift tests say each channel really adds.
    function incrementalSubs(plan){
      const lift = ATTR.models.find(m => m.key === 'lift').credit
      return plan.reduce((sum, s, i) => sum + lift[i] / Math.pow(ATTR.channels[i].spend, CURVE) * Math.pow(s, CURVE), 0)
    }

    const usd = n => '$' + Math.round(n).toLocaleString('en-US')

      const claimed = d.platforms.reduce((a, p) => a + p.n, 0)
      const pMax = claimed
      const platforms = d.platforms.map(p => `

      const ch = Object.fromEntries(d.channels.map(c => [c.key, c]))
      const seg = (key, pct) => `<span style="background:${ch[key].color};flex:${pct}" data-tip="${ch[key].label}: ${pct}% of the credit">${pct}%</span>`
      const path = ['tiktok', 'meta', 'nonbrand', 'retarget', 'brand']
      const credit = [
        ['First-touch', seg('tiktok', 100)],
        ['Last-touch', seg('brand', 100)],
        ['Linear', path.map(k => seg(k, 20)).join('')],
        ['Position-based', seg('tiktok', 40) + seg('meta', 6.7) + seg('nonbrand', 6.7) + seg('retarget', 6.7) + seg('brand', 40)],
      ].map(([m, s]) => `<div class="lbl">${m}</div><div class="viz-stack">${s}</div>`).join('')
      const legend = path.map(k => `<span><i style="background:${ch[k].color}"></i>${ch[k].label}</span>`).join('')

      const last = d.models[0].credit, lift = d.models[4].credit
      const cMax = Math.max(...last, ...lift)
      const calib = d.channels.map((c, i) => `

      const tabs = d.models.map((m, i) => `<button type="button" class="viz-tab" data-model="${m.key}" aria-pressed="${i === 0}">${m.label}</button>`).join('')

      return `
        <div class="viz-note">Made-up example: a subscription company spends $100k a month on five ad channels and gets 1,000 new subscribers a month. Each subscriber is worth $250.</div>

            <li><b>Day 10 · Brand search</b>Googles the brand name</li>
            <li class="conv"><b>Day 10 · Subscribes</b>$250 lifetime value</li>
          </ol>
          <div class="viz-legend">${legend}</div>
          <div class="viz-rows">${credit}</div>
          <p class="viz-take">Last-touch gives it all to the brand search at the end, when the person had already decided. First-touch gives it all to the TikTok ad at the start. Neither tells you whether the ads made a difference.</p>

          <div class="viz-legend"><span><i style="background:var(--muted);opacity:.55"></i>Credited by last-touch</span><span><i style="background:var(--accent)"></i>Really added, per the test</span></div>
          <div class="viz-rows viz-pair">${calib}</div>

        </div>

    function wireAttribution(){
      const root = document.getElementById('attr-decision')
      if (!root) return
      const base = incrementalSubs(ATTR.channels.map(c => c.spend))
      const results = ATTR.models.map(m => ({ m, plan: allocate(m.credit) }))
      results.forEach(r => { r.subs = incrementalSubs(r.plan) })
      const oMax = Math.max(...results.map(r => r.subs))

      function show(key){
        const { m, plan, subs } = results.find(r => r.m.key === key)
        const rows = ATTR.channels.map((c, i) => {
          const cpa = c.spend / m.credit[i]
          const change = plan[i] - c.spend
          const dir = change > 0 ? 'up' : change < 0 ? 'down' : ''
          return `<tr>
            <td><i class="viz-swatch" style="background:${c.color}"></i>${c.label}</td>
            <td class="n">${usd(c.spend)}</td>
            <td class="n">${m.credit[i]}</td>
            <td class="n${cpa > ATTR.value ? ' loss' : ''}">${usd(cpa)}</td>
            <td class="n">${usd(plan[i])}</td>
            <td class="n chg ${dir}">${change > 0 ? '+' : change < 0 ? '−' : ''}${change ? usd(Math.abs(change)) : '—'}</td>
          </tr>`
        }).join('')
        const delta = Math.round(subs - base)
        const verdict = delta < 0
          ? `The ${m.plan} loses about ${-delta} real sign-ups a month on the same spend. That's about ${usd(-delta * ATTR.value * 12)} a year.`
          : `The ${m.plan} adds about ${delta} real sign-ups a month on the same spend. That's about ${usd(delta * ATTR.value * 12)} a year.`
        root.innerHTML = `
          <div class="viz-table-wrap"><table class="viz-table" style="margin-top:12px">
            <thead><tr><th>Channel</th><th class="n">Spend now</th><th class="n">Credited sign-ups</th><th class="n">Cost each</th><th class="n">Next month</th><th class="n">Change</th></tr></thead>
            <tbody>${rows}</tbody>
          </table></div>
          <p class="viz-take">Costs above $${ATTR.value} (▲) are more than a subscriber is worth. ${verdict}</p>`
        document.getElementById('attr-outcomes').innerHTML = results.map(r => `
          <div class="lbl">${r.m.label}</div>
          <div class="viz-cell" data-tip="${r.m.label}: ${Math.round(r.subs)} incremental subscribers (today: ${Math.round(base)})">
            <div class="viz-bar${r.m.key === key ? ' hi' : ''}" style="width:${(r.subs / oMax * 70).toFixed(1)}%"></div>
            <span class="viz-val">${Math.round(r.subs)} (${r.subs >= base ? '+' : '−'}${Math.abs(Math.round(r.subs - base))})</span>
          </div>`).join('')
        document.querySelectorAll('.viz-tab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.model === key)))
      }

      document.querySelectorAll('.viz-tab').forEach(b => b.addEventListener('click', () => show(b.dataset.model)))

    }

    // One shared hover/focus tooltip for any [data-tip] element.
    const vizTip = document.createElement('div')
    vizTip.className = 'viz-tip'
    vizTip.setAttribute('role', 'tooltip')
    document.body.appendChild(vizTip)
    function showTip(el, x, y){
      vizTip.textContent = el.dataset.tip
      vizTip.style.left = Math.min(x + 12, window.innerWidth - vizTip.offsetWidth - 8) + 'px'
      vizTip.style.top = (y + 14) + 'px'
      vizTip.style.opacity = '1'
    }
    document.addEventListener('pointermove', e => {
      const el = e.target.closest && e.target.closest('[data-tip]')
      if (el) showTip(el, e.clientX, e.clientY)
      else vizTip.style.opacity = '0'
    })
    document.addEventListener('scroll', () => { vizTip.style.opacity = '0' }, { passive: true })

    // --- Resume chat (embedded at the top of Home) ---
    const chatHistory = [] // {role: 'user'|'assistant', content: string} — persists across route changes

    const CANNED_PROMPTS = [
      "What does Christopher do at flyExclusive?",
      "What LLM and RAG projects has Christopher built?",
      "What's Christopher's educational background?",
      "How can I get in touch with Christopher?",
    ]

    function appendMessage(container, role, text, opts){
      opts = opts || {}
      const div = document.createElement('div')
      div.className = 'chat-msg ' + role + (opts.pending ? ' pending' : '')
      div.textContent = text
      container.appendChild(div)
      container.scrollTop = container.scrollHeight
      return div
    }

    async function sendChatMessage(els, rawText){
      const text = rawText.trim()
      if(!text) return

      els.input.value = ''
      els.input.disabled = true
      els.send.disabled = true
      els.prompts.style.display = 'none'

      appendMessage(els.messages, 'user', text)
      chatHistory.push({role: 'user', content: text})
      if(window.siteTrack) siteTrack('chat_message_sent', {canned: CANNED_PROMPTS.includes(text)})
      const pending = appendMessage(els.messages, 'assistant', 'Thinking…', {pending: true})

      try{
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({messages: chatHistory})
        })
        const data = await res.json().catch(()=>({}))
        if(!res.ok || !data.reply){
          throw new Error(data.error || 'Something went wrong')
        }
        pending.textContent = data.reply
        pending.classList.remove('pending')
        chatHistory.push({role: 'assistant', content: data.reply})
      }catch(err){
        pending.textContent = "Sorry, I couldn't get a response right now. Try again in a moment, or email cjneale.analyst@gmail.com."
        pending.classList.remove('pending')
      }finally{
        els.input.disabled = false
        els.send.disabled = false
        els.input.focus()
      }
    }

    // Home's DOM is rebuilt every time you navigate back to it, so the chat
    // UI has to be re-wired (and any prior conversation replayed) each time
    // renderHome() runs — chatHistory itself lives outside render and survives.
    function initChat(){
      const els = {
        messages: document.getElementById('chat-messages'),
        form: document.getElementById('chat-form'),
        input: document.getElementById('chat-input'),
        send: document.getElementById('chat-send'),
        prompts: document.getElementById('chat-prompts'),
      }
      if(!els.form) return

      els.prompts.innerHTML = CANNED_PROMPTS
        .map(p => `<button type="button" class="chat-prompt-btn" data-prompt="${p.replace(/"/g, '&quot;')}">${p}</button>`)
        .join('')

      chatHistory.forEach(m => appendMessage(els.messages, m.role, m.content))
      if(chatHistory.length) els.prompts.style.display = 'none'

      els.form.addEventListener('submit', function(e){
        e.preventDefault()
        sendChatMessage(els, els.input.value)
      })

      els.input.addEventListener('keydown', function(e){
        if(e.key === 'Enter' && !e.shiftKey){
          e.preventDefault()
          els.form.requestSubmit()
        }
      })

      els.prompts.addEventListener('click', function(e){
        const btn = e.target.closest('.chat-prompt-btn')
        if(!btn) return
        sendChatMessage(els, btn.dataset.prompt)
      })
    }

    // initialize
    window.addEventListener('hashchange', router)
    window.addEventListener('load', router)
  </script>
